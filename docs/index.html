<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car Racing Game</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <canvas id="game" width="500" height="700" aria-label="Car racing game"></canvas>
      <div class="controls" aria-label="Touch controls">
        <button id="leftBtn" type="button">Left</button>
        <button id="jumpBtn" type="button">Jump</button>
        <button id="rightBtn" type="button">Right</button>
      </div>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
